<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Авторизация</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				max-width: 400px;
				margin: 0 auto;
				padding: 20px;
			}
			h1 {
				text-align: center;
			}
			.provider-btn {
				display: block;
				width: 100%;
				margin: 10px 0;
				padding: 10px;
				background: #007bff;
				color: white;
				border: none;
				cursor: pointer;
			}
			.provider-btn:hover {
				background: #0056b3;
			}
			form {
				margin-top: 20px;
			}
			input {
				width: 100%;
				padding: 10px;
				margin: 5px 0;
			}
			button {
				width: 100%;
				padding: 10px;
				background: #28a745;
				color: white;
				border: none;
				cursor: pointer;
			}
			button:hover {
				background: #218838;
			}
		</style>
	</head>
	<body>
		<h1>Вход в систему</h1>
		<div id="providers"></div>
		<form id="login-form" style="display: none">
			<input
				type="text"
				id="login"
				placeholder="Логин (email)"
				required
			/>
			<input
				type="password"
				id="password"
				placeholder="Пароль"
				required
			/>
			<input type="hidden" id="client_id" />
			<input type="hidden" id="redirect_uri" />
			<input type="hidden" id="state" />
			<input type="hidden" id="code_challenge" />
			<input type="hidden" id="nonce" />
			<button type="submit">Войти</button>
		</form>
		<script src="script.js"></script>
	</body>
</html>
